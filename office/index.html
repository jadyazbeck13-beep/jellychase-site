<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, product-grade, playful only in the 3D office
   IDEA: a real studio floor you look down into, each desk an agent's live status
   PICTURE: the 3D office itself, full width, with floating name tags
   COLOUR and TYPE: warm white floor, deep teal support, coral accent; Figtree
   LAYOUT: office on top (side by side on wide screens), control panel with tabs below */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#121413);--card:light-dark(#ffffff,#1b1e1d);--ink:light-dark(#15171a,#eef0ee);--mute:light-dark(#646a6e,#9aa19e);--line:light-dark(#e6e2da,#2b302e);--teal:light-dark(#0f4c4a,#5fc4b8);--coral:#ff5a36;--amber:#e8a317;--green:#22b573}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,textarea,input{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px max(3vw,14px)}
h1{font-size:20px;margin:0;line-height:1.1;display:flex;align-items:center;gap:8px}
h1 i{width:12px;height:12px;border-radius:50%;background:var(--coral);display:inline-block}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.pill.warn{background:#fff3d6;color:#6b4a00;border-color:#f3d48a}
.main{display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.main{grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 64px)}.stage{height:100%!important}.panel{height:100%;overflow:auto;border-left:1px solid var(--line)}}
.stage{position:relative;height:58vh;min-height:360px;background:#ffd2b4;overflow:hidden;touch-action:none}
.stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.92);color:#15171a;border-radius:8px;padding:3px 7px 4px;text-align:center;box-shadow:0 3px 10px rgba(30,25,15,.12);font-size:10px;line-height:1.2;white-space:nowrap;position:relative;border:1.5px solid transparent}
.tag b{display:block;font-size:11px}
.tag span{color:#5b6064}
.tag em{font-style:normal;display:block;font-size:9px;color:#0f4c4a;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.tag em:empty{display:none}
.tag::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#b9bec2;border:1.5px solid #fff}
@media(max-width:600px){.tag span{display:none}.tag{padding:2px 6px 3px}}
.tag[data-s=working]::before{background:var(--green);animation:pulse 1s infinite}
.tag[data-s=waiting]::before{background:var(--amber)}
.tag.sel{border-color:var(--coral)}
@keyframes pulse{50%{transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.tag::before{animation:none!important}}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:#5b6064;background:rgba(255,255,255,.8);padding:4px 10px;border-radius:8px;pointer-events:none}
.panel{background:var(--bg);padding:14px max(3vw,14px) 40px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:10px 12px;min-height:44px;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--coral)}
.count{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:4px}
h2{font-size:18px;margin:0 0 6px;line-height:1.2}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:16px;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.go{background:var(--coral);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.go:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:36px;text-align:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{font-size:15px;margin:0 0 2px}
.meta{font-size:13px;color:var(--mute)}
.card pre{white-space:pre-wrap;font:15px/1.5 Figtree,system-ui,sans-serif;margin:8px 0 0;max-height:none}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ok{background:var(--teal);color:#fff;border-color:var(--teal)}
.feed{list-style:none;padding:0;margin:14px 0 0;font-size:14px}
.feed li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.feed time{color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.who{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.stream{font-size:14px;color:var(--mute);white-space:pre-wrap;max-height:200px;overflow:auto;border-left:3px solid var(--line);padding-left:10px;margin-top:10px}
.notice{background:#fff3d6;color:#6b4a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
details{margin-top:18px;font-size:14px;color:var(--mute)}
summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:32px}
.empty{color:var(--mute);font-size:14px;padding:16px 0}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:linear-gradient(#7fb6ee,#ffd9b0 60%,#ffb7a0)}
#gate[hidden]{display:none}.gcard{background:var(--card);border-radius:20px;padding:28px 24px;width:min(380px,100%);box-shadow:0 20px 60px rgba(40,20,10,.25)}
.gcard h1{font-size:24px;margin:0 0 6px}.gcard p{color:var(--mute);margin:0 0 16px;font-size:15px}.gcard label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.gcard input{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.perr{min-height:20px;margin:10px 0 0!important;color:#c0392b!important;font-size:14px!important}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="gate" hidden><form id="gateForm" class="gcard"><h1><i></i>Agent HQ</h1><p>This office is private. Enter the password to come in.</p>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><button class="go" type="submit">Enter</button><p id="pwErr" class="perr" aria-live="polite"></p></form></div>
<div class="app">
<header>
  <h1><i></i><span id="co">Agent HQ</span></h1>
  <div class="bar">
    <button class="pill warn" id="apPill" hidden></button>
    <button class="pill on" id="vWhole">Whole office</button>
    <button class="pill" id="vTour">Tour</button>
    <button class="pill on" id="brk">Breaks on</button>
  </div>
</header>
<div class="main">
  <div class="stage" id="stage"><div class="labels" id="labels"></div><div class="hint">Drag to orbit · tap a desk</div></div>
  <section class="panel">
    <div id="notice" class="notice" hidden>The agents think with Claude, so here on the website the office is a live preview: you can look around, but they can’t take briefs yet.</div>
    <nav class="tabs" id="tabs">
      <button data-t="brief" class="on">Brief</button>
      <button data-t="agent">Agent</button>
      <button data-t="appr">Approvals<span class="count" id="apCount" hidden>0</span></button>
      <button data-t="out">Outputs</button>
    </nav>
    <div id="view"></div>
  </section>
</div>
</div>

let OFFICE_PW='';
async function unlock(){
  const gate=document.getElementById('gate'),form=document.getElementById('gateForm'),inp=document.getElementById('pw'),err=document.getElementById('pwErr');
  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const tryPw=async pw=>{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(ENC.iv)},key,u8(ENC.ct));return JSON.parse(new TextDecoder().decode(pt));};
  let saved=null;try{saved=sessionStorage.getItem('hq-pw');}catch{}
  if(saved){try{const d=await tryPw(saved);OFFICE_PW=saved;gate.remove();return d;}catch{}}
  gate.hidden=false;inp.focus();
  return new Promise(res=>{form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='Checking…';
    try{const d=await tryPw(inp.value.trim());OFFICE_PW=inp.value.trim();try{sessionStorage.setItem('hq-pw',inp.value.trim());}catch{}gate.remove();res(d);}
    catch{err.textContent='Wrong password. Try again.';inp.select();}});});
}

const API_URL='https://europe-west1-jelly-chase-764b5.cloudfunctions.net/agentChat';
async function officeKey(){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hq-office:'+OFFICE_PW));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function makeApiSample(){
  const call=async body=>{let r;try{r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json','x-office-key':await officeKey()},body:JSON.stringify(body)});}catch{const e=new Error('their brain isn’t online yet. Run setup-agents.bat on your PC, then try again.');e.code='server';throw e;}
    let j={};try{j=await r.json();}catch{}
    if(!r.ok){if(r.status===404){const e=new Error('their brain isn’t online yet. Run setup-agents.bat on your PC.');e.code='server';throw e;}const e=new Error(j.error||('error '+r.status));e.code=r.status===401?'not_granted':r.status===429?'rate_limited':'server';throw e;}return j;};
  const sample=async(input,opts={})=>{
    const messages=typeof input==='string'?[{role:'user',content:input}]:input.slice();
    const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object',properties:{}}}));
    let all='';
    for(let step=0;step<8;step++){
      const r=await call({messages,tools});const txt=(r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      if(txt){all+=(all?'\n':'')+txt;opts.onText&&opts.onText({text:all});}
      const uses=(r.content||[]).filter(b=>b.type==='tool_use');
      if(r.stop_reason!=='tool_use'||!uses.length)return {text:all,truncated:r.stop_reason==='max_tokens'};
      messages.push({role:'assistant',content:r.content});
      const results=[];for(const u of uses){const t=(opts.tools||[]).find(x=>x.name===u.name);
        try{const out=t?await t.execute(u.input||{}):'Unknown tool';results.push({type:'tool_result',tool_use_id:u.id,content:String(out??'')});}
        catch(e){results.push({type:'tool_result',tool_use_id:u.id,content:String(e.message||e),is_error:true});}}
      messages.push({role:'user',content:results});
    }
    return {text:all,truncated:true};
  };
  sample.json=async(input,opts={})=>{const r=await sample(input+'\n\nReply with the JSON only, no other text.',opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);if(!m)throw new Error('No JSON in the answer');return JSON.parse(m[0]);};
  return sample;
}

function person(a){

  const g=new THREE.Group(),o=OUTFITS[a.world],k=JW/420;
  const img=new Image();const tex=new THREE.Texture(img);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  img.onload=()=>{tex.needsUpdate=true;};img.src=o.src;

  spr.center.set(o.cx,o.by);const SW=o.w*k,SH=o.h*k;spr.scale.set(SW,SH,1);g.add(spr);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.3,24),new THREE.MeshBasicMaterial({color:0x2b1b3d,transparent:true,opacity:0,depthWrite:false}));

}

{const counter=box(.9,.95,2.4,M(0xe9dcc6),-7.45,.475,.1);scene.add(counter);
 scene.add(box(.4,.5,.35,M(0x2a2d31),-7.45,1.2,-.3));scene.add(box(.06,.1,.06,M(0xff5a36),-7.3,1.2,-.12));
 [-0,.25,.5].forEach(o=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.045,.11,12),M(0xffffff));m.position.set(-7.45,1.01,.5+o);scene.add(m);});
 const cb=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1,16),M(0xf2efe9));cb.position.set(7.2,.5,-2.6);cb.castShadow=true;scene.add(cb);
 const jug=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.45,16),new THREE.MeshStandardMaterial({color:0x8fc8ee,transparent:true,opacity:.7,roughness:.1}));jug.position.set(7.2,1.23,-2.6);scene.add(jug);
 plant(-7.2,-1.6,.8);}
const V=(x,z)=>new THREE.Vector3(x,0,z);
const SPOTS={
  coffee:{label:'Coffee break',via:[V(-6,.1)],at:[V(-6.75,-.25),V(-6.75,.55)],face:-Math.PI/2,mug:true},
  cooler:{label:'At the water cooler',via:[V(5.6,.1),V(5.6,-2.6)],at:[V(6.5,-2.9),V(6.5,-2.2)],face:Math.PI/2},
  windowL:{label:'Taking a stroll',via:[V(-3.9,.1)],at:[V(-4.25,-3.45),V(-3.55,-3.45)],face:Math.PI},
  windowR:{label:'Stretching',via:[V(3.9,.1)],at:[V(3.55,-3.45),V(4.25,-3.45)],face:Math.PI}
};
let breaksOn=!reduce;
const BREAK_EVERY=3*3600, BREAK_LEN=5*60; // seconds: a 5-minute break every 3 hours
{const b=document.getElementById('brk');const paint=()=>{b.classList.toggle('on',breaksOn);b.textContent=breaksOn?'Breaks on':'Breaks off';};paint();
 b.onclick=()=>{breaksOn=!breaksOn;paint();};}
const P=()=>AGENTS.map(a=>desks[a.id].p);
const angTo=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
function startBreak(p,t){
  const ppl=P(),onSpot=ppl.filter(q=>q!==p&&q.state==='break'&&q.spot);
  let key,slot=0,buddy=null;
  const joinable=onSpot.filter(q=>!ppl.some(r=>r!==q&&r.spot===q.spot));
  if(joinable.length&&Math.random()<.65){buddy=joinable[Math.floor(Math.random()*joinable.length)];key=buddy.spot;slot=1-buddy.slot;}
  else{const free=Object.keys(SPOTS).filter(k=>!ppl.some(q=>q.spot===k));if(!free.length)return;key=free[Math.floor(Math.random()*free.length)];}
  const sp=SPOTS[key];p.spot=key;p.slot=slot;p.with=buddy?buddy.id:null;
  p.route=[p.exit.clone(),V(p.exit.x,.1),...sp.via.map(v=>v.clone()),sp.at[slot].clone()];p.ri=0;p.state='rising';
  if(buddy){buddy.with=p.id;buddy.breakEnd=Math.max(buddy.breakEnd,t+60);}
  tagNote(p.id);
}
function goBack(p){p.path=p.route.slice(0,p.ri).reverse().concat([p.seat.clone()]);
  if(p.with){const b=desks[p.with].p;if(b.with===p.id)b.with=null;}p.state='back';p.spot=null;p.with=null;p.mug.visible=false;tagNote(p.id);}
function breaks(t){
  for(const p of P()){const busy=S.status[p.id]!=='idle';
    if(p.state==='sit'&&!busy&&breaksOn&&t>p.next&&P().filter(q=>q.state!=='sit').length<3)startBreak(p,t);
    if(p.state==='rising'&&p.standK>.92){p.state='out';p.path=p.route.slice();}
    if(p.state==='break'&&(t>p.breakEnd||busy||!breaksOn))goBack(p);
    if((p.state==='out'||p.state==='rising')&&(busy||!breaksOn))goBack(p);}
}
function breakInfo(id){const p=desks[id].p,t=clock.elapsedTime;if(p.state!=='sit')return 'on a break';if(!breaksOn)return 'breaks off';const m=Math.max(0,Math.round((p.next-t)/60));return m<1?'break any moment':'next break in '+(m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m');}
function tagNote(id){const p=desks[id].p,el=desks[id].el.querySelector('em');
  if(S.status[id]!=='idle'){el.textContent=S.note[id]||'';return;}
  el.textContent=p.state==='break'?(p.with?'Chatting with '+byId(p.with).name:SPOTS[p.spot].label):(p.state==='out'||p.state==='rising')?'Taking a break':p.state==='back'?'Heading back':'';}
function animatePerson(p,dt,t,s,ph){
  // movement
  let moving=false;
  if((p.state==='out'||p.state==='back')&&p.path.length){const tg=p.path[0],dx=tg.x-p.g.position.x,dz=tg.z-p.g.position.z,dist=Math.hypot(dx,dz);
    if(dist<.04){p.path.shift();if(p.state==='out')p.ri++;}
    else{const st=Math.min(dist,1.05*dt);p.g.position.x+=dx/dist*st;p.g.position.z+=dz/dist*st;p.face=Math.atan2(dx,dz);moving=true;}}
  if(p.state==='out'&&!p.path.length){p.state='break';p.ri=p.route.length;p.breakEnd=Math.max(p.breakEnd,t+BREAK_LEN);
    const sp=SPOTS[p.spot];p.face=sp.face;p.mug.visible=!!sp.mug;tagNote(p.id);}
  if(p.state==='back'&&!p.path.length){p.state='sitting';p.face=0;}
  if(p.state==='break'&&p.with){const b=desks[p.with].p;if(b.state==='break'&&b.spot===p.spot){p.face=Math.atan2(b.g.position.x-p.g.position.x,b.g.position.z-p.g.position.z);}}
  if(p.state==='sitting'&&Math.abs(angTo(p.yaw,0))<.05&&p.standK<.04){p.state='sit';p.g.position.copy(p.seat);p.next=t+BREAK_EVERY;tagNote(p.id);}
  p.yaw+=angTo(p.yaw,p.face)*Math.min(1,dt*8);p.g.rotation.y=p.yaw;
  const wantStand=p.state==='sit'||(p.state==='sitting'&&Math.abs(angTo(p.yaw,0))<.1)?0:1;
  p.standK+=(wantStand-p.standK)*Math.min(1,dt*(reduce?20:4));const sk=p.standK;
  // jelly pose: sits on the chair, hops when walking, squash and stretch
  const baseY=.5*(1-sk);let hop=0,sq=0,sway=0;
  if(moving){p.walkPh+=dt*9;const h=Math.abs(Math.sin(p.walkPh));hop=h*.16;sq=(.5-h)*.16;}
  else if(reduce){}
  else if(p.state==='sit'&&s==='working'){sq=Math.sin(t*10+ph)*.045;hop=Math.max(0,Math.sin(t*10+ph))*.02;}
  else if(p.state==='sit'&&s==='waiting'){sway=Math.sin(t*1.6+ph)*.12;sq=Math.sin(t*3.2+ph)*.02;}
  else if(p.state==='break'){if(p.with){const b=Math.abs(Math.sin(t*4+ph));hop=b*.05;sq=(.5-b)*.06;}
    else if(p.mug.visible){sq=Math.sin(t*1.4+ph)*.03;p.mug.position.y=.34+Math.max(0,Math.sin(t*.9+ph))**8*.12;}
    else{sq=-Math.max(0,Math.sin(t*1.1+ph))*.14;sway=Math.sin(t*.55+ph)*.08;}}
  else sq=Math.sin(t*2.2+ph)*.025;
  p.spr.scale.set(p.SW*(1+sq*.7),p.SH*(1-sq),1);p.spr.position.y=baseY+hop;p.spr.material.rotation=sway;
  
  if(p.lab)p.lab.position.y=baseY+p.top*(1-sq)+hop+.08;
  p.g.rotation.y=0;
}
const COL={idle:0xb9bec2,working:0x22b573,waiting:0xe8a317};
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=clock.getDelta(),t=clock.elapsedTime;
  if(mode==='tour'){tourT+=dt;if(tourT>4.5){tourT=0;tourI++;focusDesk(AGENTS[tourI%AGENTS.length].id);}}
  if(flying){camera.position.lerp(want.pos,.06);controls.target.lerp(want.tgt,.06);if(camera.position.distanceTo(want.pos)<.02)flying=false;}
  breaks(t);
  for(const a of AGENTS){const k=desks[a.id],s=S.status[a.id],ph=k.phase,p=k.p;
    k.ringM.color.setHex(COL[s]);k.ringM.opacity=s==='idle'?.35:.55+.3*Math.sin(t*4);
    k.scr.emissiveIntensity=s==='working'&&p.state==='sit'?.5+.25*Math.sin(t*6):.25;
    p.eyeM.emissiveIntensity=s==='working'?1.3+.7*Math.sin(t*5+ph):s==='waiting'?.6+.5*Math.sin(t*2):.7;
    animatePerson(p,dt,t,s,ph);}
  controls.update();renderer.render(scene,camera);labelR.render(scene,camera);
});

// ---------- Agents ----------
function setStatus(id,s,note){S.status[id]=s;if(note!==undefined)S.note[id]=note;const k=desks[id];k.el.dataset.s=s;tagNote(id);render();}
function settle(id){setStatus(id,S.approvals.some(x=>x.agent===id&&x.state==='pending')?'waiting':'idle',S.approvals.some(x=>x.agent===id&&x.state==='pending')?'Waiting for your approval':'');}
const short=s=>{s=String(s);return s.length>40?s.slice(0,38)+'…':s;};

function toolsFor(a){return [
  {name:'save_output',description:'Save your finished deliverable for the owner. Call exactly once with the final work.',
   inputSchema:{type:'object',properties:{title:{type:'string'},content:{type:'string'}},required:['title','content']},
   execute:({title,content})=>{S.outputs.unshift({agent:a.id,title:String(title).slice(0,120),content:String(content),at:now()});log(`${a.name} delivered “${short(title)}”`);return 'Saved.';}},
  {name:'request_approval',description:'Ask the owner to approve an action before it happens: publishing, sending a message or email, contacting anyone outside the company, or spending money. Do not assume approval.',
   inputSchema:{type:'object',properties:{action:{type:'string'},reason:{type:'string'}},required:['action','reason']},
   execute:({action,reason})=>{S.approvals.unshift({id:Math.random().toString(36).slice(2),agent:a.id,action:String(action),reason:String(reason),state:'pending',at:now()});log(`${a.name} asked for approval: ${short(action)}`);return 'Queued for approval. Prepare everything, but do not treat it as approved.';}},
  {name:'read_outputs',description:'Read what teammates have delivered so far, to build on their work.',
   inputSchema:{type:'object',properties:{}},
   execute:()=>JSON.stringify(S.outputs.slice(0,6).map(o=>({by:byId(o.agent).name,title:o.title,content:o.content.slice(0,700)})))}
];}

async function runAgent(a,task){
  setStatus(a.id,'working',short(task));S.stream[a.id]='';log(`${a.name} started: ${short(task)}`);
  const before=S.outputs.length;
  const prompt=`You are ${a.name}, the ${a.role} at ${COMPANY}, an AI team working for its owner.
Your strengths: ${a.skills}
Task from the owner or the Chief of Staff:
"""${task}"""
Rules:
- Check teammates' work with read_outputs if it would help.
- Do the work yourself, concretely, ready to use. Keep the deliverable under 220 words, plain text with short lines or bullets, no markdown headings.
- If the work would need publishing, sending, contacting someone outside, or spending money, call request_approval for that action instead of claiming it happened.
- Finish by calling save_output once with a clear title and the deliverable. Then reply with one sentence summarising what you did.`;
  try{
    const r=await S.sample(prompt,{tools:toolsFor(a),modelTier:'default',cache:false,onText:({text})=>{S.stream[a.id]=text;if(S.tab==='agent'&&S.sel===a.id)paintStream();}});
    if(S.outputs.length===before&&r.text)S.outputs.unshift({agent:a.id,title:short(task),content:r.text,at:now()});
    S.stream[a.id]=r.text||'';
  }catch(e){log(e.code==='rate_limited'?`${a.name}: the team hit today's limit. Try again tomorrow.`:`${a.name} hit a problem: ${e.message||e}`);if(e.code==='not_granted')noAccess();}
  settle(a.id);
}

async function runBrief(brief){
  if(!S.sample||S.busy)return;S.busy=true;render();
  const cos=byId('cos');setStatus('cos','working','Planning the work');log(`New brief: ${short(brief)}`);
  try{
    const team=AGENTS.filter(a=>a.id!=='cos').map(a=>`${a.id}: ${a.name}, ${a.role}. ${a.skills}`).join('\n');
    const plan=await S.sample.json(`You are ${cos.name}, Chief of Staff of ${COMPANY}, an AI team. Split the owner's brief into tasks for the right teammates.
Brief: """${brief}"""
Team (id: name, role):
${team}
Return only JSON: {"summary":"one sentence plan","tasks":[{"agent":"<id>","task":"specific, self-contained instruction"}]}. Use 1 to 4 tasks and only the people needed.`,{modelTier:'default',cache:false});
    const tasks=(plan?.tasks||[]).filter(t=>byId(t.agent)&&t.agent!=='cos').slice(0,4);
    if(!tasks.length)throw new Error('No tasks in the plan');
    log(`${cos.name}: ${plan.summary||'Plan ready'}`);setStatus('cos','working','Coordinating '+tasks.length+' tasks');
    const q=[...tasks];const worker=async()=>{while(q.length){const t=q.shift();await runAgent(byId(t.agent),t.task);}};
    await Promise.all([worker(),worker()]);
    setStatus('cos','working','Writing the wrap-up');
    await runAgent(cos,`Write the owner a short wrap-up of this brief: "${brief}". Read the team's outputs, say what is done, what needs their approval, and the next step.`);
  }catch(e){log(`${cos.name} couldn’t start: ${e.message||e}`);if(e.code==='not_granted')noAccess();settle('cos');}
  S.busy=false;render();
}

function decide(id,ok){const x=S.approvals.find(a=>a.id===id);if(!x)return;x.state=ok?'approved':'declined';
  log(`${ok?'Approved':'Declined'}: ${short(x.action)} (${byId(x.agent).name})`);settle(x.agent);}

// ---------- UI ----------
const view=document.getElementById('view');
const PRESETS=['Plan a launch week for our new product in Arabic and English','Research 3 competitors and suggest a positioning line','Make a one-week Instagram plan with captions','Draft a welcome email for new customers and a budget for ads'];
function select(id){const pp=desks[id].p;if(pp.state==='rising'||pp.state==='out'||pp.state==='break'){goBack(pp);log(`You called ${byId(id).name} back from their break`);}S.sel=id;S.tab='agent';if(mode!=='tour'){mode='free';document.getElementById('vWhole').classList.remove('on');}focusDesk(id);render();}
function noAccess(){S.sample=null;const n=document.getElementById('notice');if(/jellychase\.app$/.test(location.hostname))n.textContent='The agents can’t reach their brain right now (the office lock or the Firebase setup needs checking).';n.hidden=false;render();}
function paintStream(){const el=document.getElementById('stream');if(el)el.textContent=S.stream[S.sel]||'';}
function outCard(o,i){const a=byId(o.agent);return `<div class="card"><h3>${esc(o.title)}</h3><div class="meta">${esc(a.name)} · ${esc(a.role)} · ${esc(o.at)}</div><pre>${esc(o.content)}</pre><div class="row"><button class="btn" data-copy="${i}">Copy</button></div></div>`;}

function render(){
  const pend=S.approvals.filter(a=>a.state==='pending').length;
  const pill=document.getElementById('apPill');pill.hidden=!pend;pill.textContent=`${pend} decision${pend>1?'s':''} need${pend>1?'':'s'} your approval`;
  const c=document.getElementById('apCount');c.hidden=!pend;c.textContent=pend;
  for(const a of AGENTS)desks[a.id].el.classList.toggle('sel',S.sel===a.id);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const dis=!S.sample||S.busy;
  if(S.tab==='brief'){
    const keep=document.getElementById('brief')?.value||'';
    view.innerHTML=`<h2>Give the team a brief</h2><p class="sub">${esc(byId('cos').name)}, your Chief of Staff, splits it into tasks and assigns the right people. Anything risky lands in Approvals.</p>
    <textarea id="brief" placeholder="What do you need done?">${esc(keep)}</textarea>
    <div class="chips">${PRESETS.map((p,i)=>`<button class="chip" data-p="${i}">${esc(p)}</button>`).join('')}</div>
    <button class="go" id="send" ${dis?'disabled':''}>${S.busy?'Team is working…':'Send to the team'}</button>
    ${S.feed.length?`<ul class="feed">${S.feed.map(f=>`<li><time>${esc(f.at)}</time><span>${esc(f.t)}</span></li>`).join('')}</ul>`:'<p class="empty">Activity shows up here as the agents work.</p>'}
    <details><summary>How the agents work</summary><p>Each desk is the same Claude model with its own role prompt and three tools: <b>save_output</b>, <b>request_approval</b> and <b>read_outputs</b>. Claude decides when to call them in a loop until the task is done. The Chief of Staff plans first, then up to two agents work at once. Approvals here are a gate only: nothing is actually posted or sent from this prototype.</p></details>`;
  } else if(S.tab==='agent'){
    if(!S.sel){view.innerHTML=`<p class="empty">Tap a desk or a name tag in the office to open that agent.</p>`;return;}
    const a=byId(S.sel),mine=S.outputs.filter(o=>o.agent===a.id);
    view.innerHTML=`<div class="who"><div class="av" style="background:${a.color}">${esc(a.name[0])}</div><div><h2>${esc(a.name)}</h2><div class="meta">${esc(a.role)} · ${esc(S.status[a.id])} · ${esc(breakInfo(a.id))}</div></div></div>
    <p class="sub" style="margin-top:10px">${esc(a.skills)}</p>
    <textarea id="direct" placeholder="Give ${esc(a.name)} a task directly"></textarea>
    <button class="go" id="sendDirect" ${(!S.sample||S.status[a.id]==='working')?'disabled':''}>Assign to ${esc(a.name)}</button>
    <div class="stream" id="stream"></div>
    ${mine.length?mine.map(o=>outCard(o,S.outputs.indexOf(o))).join(''):'<p class="empty">No outputs yet.</p>'}`;
    paintStream();
  } else if(S.tab==='appr'){
    view.innerHTML=`<h2>Approvals</h2><p class="sub">Agents ask before publishing, sending or spending.</p>`+
    (S.approvals.length?S.approvals.map(x=>{const a=byId(x.agent);return `<div class="card"><h3>${esc(x.action)}</h3><div class="meta">${esc(a.name)} · ${esc(x.at)} · ${esc(x.state)}</div><p style="margin:6px 0 0;font-size:15px">${esc(x.reason)}</p>
      ${x.state==='pending'?`<div class="row"><button class="btn ok" data-ok="${esc(x.id)}">Approve</button><button class="btn" data-no="${esc(x.id)}">Decline</button></div>`:''}</div>`;}).join(''):'<p class="empty">Nothing waiting for you.</p>');
  } else {
    view.innerHTML=`<h2>Outputs</h2><p class="sub">Everything the team delivered, newest first.</p>`+(S.outputs.length?S.outputs.map(outCard).join(''):'<p class="empty">No outputs yet. Send a brief to start.</p>');
  }
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;render();}});
document.getElementById('apPill').onclick=()=>{S.tab='appr';render();};
view.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.p!==undefined){document.getElementById('brief').value=PRESETS[+t.dataset.p];}
  else if(t.id==='send'){const v=document.getElementById('brief').value.trim();if(v){document.getElementById('brief').value='';runBrief(v);}}
  else if(t.id==='sendDirect'){const v=document.getElementById('direct').value.trim();if(v&&S.sample)runAgent(byId(S.sel),v);}
  else if(t.dataset.ok)decide(t.dataset.ok,true);
  else if(t.dataset.no)decide(t.dataset.no,false);
  else if(t.dataset.copy!==undefined){const o=S.outputs[+t.dataset.copy];navigator.clipboard?.writeText(o.title+'\n\n'+o.content).then(()=>{t.textContent='Copied';},()=>{t.textContent='Copy failed';});}
});
AGENTS.forEach(a=>setStatus(a.id,'idle',''));
render();
(async()=>{for(let i=0;i<30&&!window.claude?.use;i++)await new Promise(r=>setTimeout(r,100));
  try{S.sample=await window.claude?.use?.('sample');}catch{S.sample=null;}
  if(!S.sample&&!window.claude&&/jellychase\.app$/.test(location.hostname))S.sample=makeApiSample();
  if(!S.sample)document.getElementById('notice').hidden=false;render();})();
</script>
