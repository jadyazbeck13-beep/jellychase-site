<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly Chase</title>
<meta name="description" content="Jelly Chase: a maze chase game starring a squishy violet jelly. Coming soon to iPhone and Android.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Jelly Chase">
<meta property="og:description" content="A maze chase game starring a squishy violet jelly. Coming soon to iPhone and Android.">
<meta property="og:image" content="https://jellychase.app/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --violet: #4A2170; --plum: #2B0F45; --orange: #FFA436; --pink: #F2629F; --lime: #B8F04A; }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: Nunito, system-ui, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(120% 80% at 50% 0%, #8A4FD0 0%, var(--violet) 55%, var(--plum) 100%);
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
  }
  /* floating jelly drops in the background */
  .drops { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .drops i {
    position: absolute; bottom: -60px; width: var(--s); height: calc(var(--s) * 1.15);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 35% 30%, #fff9 0 12%, transparent 13%), var(--c);
    box-shadow: inset -4px -6px 0 #0002; opacity: .85;
    animation: rise var(--d) linear infinite; animation-delay: var(--w);
  }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); } }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px 32px; gap: 28px; position: relative; z-index: 1; }
  .hero { width: min(300px, 70vw); height: auto; filter: drop-shadow(0 18px 24px #0006); animation: squish 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes squish {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-22px) scale(.97, 1.04); }
    60% { transform: translateY(0) scale(1.06, .93); }
    75% { transform: translateY(0) scale(.98, 1.02); }
  }
  h1 {
    font-family: 'Lilita One', Nunito, sans-serif; font-weight: 400; font-size: clamp(56px, 13vw, 104px); line-height: .95; letter-spacing: 1px;
    -webkit-text-stroke: 10px var(--plum); paint-order: stroke fill; text-shadow: 0 8px 0 var(--plum);
  }
  h1 span { color: var(--orange); }
  .tag { font-size: clamp(18px, 4.6vw, 22px); font-weight: 800; max-width: 520px; line-height: 1.45; opacity: .95; }
  .badges { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .badge {
    display: flex; align-items: center; gap: 12px; padding: 14px 26px 14px 18px; border-radius: 999px;
    background: linear-gradient(#FFC266, var(--orange) 55%, #F27C12); color: #fff;
    border: 3px solid #fff8; box-shadow: 0 6px 0 #B8520A, 0 14px 22px #0005, inset 0 3px 0 #fff8;
    font-family: 'Lilita One', sans-serif; font-size: 20px; letter-spacing: .5px; position: relative;
    text-shadow: 0 2px 0 #B8520A;
  }
  .badge::after { content: ''; position: absolute; left: 18px; top: 6px; width: 30%; height: 8px; border-radius: 8px; background: #fff7; }
  .badge svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 2px 0 #B8520A); }
  .badge small { display: block; font-family: Nunito, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: .9; text-shadow: none; }
  .badge b { display: block; font-weight: 400; line-height: 1; }
  .badge > div { text-align: left; }
  footer { position: relative; z-index: 1; padding: 28px 24px 40px; display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; font-weight: 800; }
  footer a {
    color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 999px;
    background: #ffffff1f; border: 2px solid #ffffff33;
  }
  footer a:hover { background: #ffffff33; }
  @media (prefers-reduced-motion: reduce) { .hero, .drops i { animation: none; } }
</style>
</head>
<body>
<div class="drops" aria-hidden="true">
  <i style="--s:26px;--c:#F2629F;left:6%;--d:14s;--w:-2s"></i>
  <i style="--s:18px;--c:#FFC93C;left:18%;--d:11s;--w:-7s"></i>
  <i style="--s:34px;--c:#48D6A8;left:30%;--d:17s;--w:-4s"></i>
  <i style="--s:20px;--c:#5BA8FF;left:62%;--d:12s;--w:-9s"></i>
  <i style="--s:30px;--c:#FF8A2B;left:76%;--d:15s;--w:-1s"></i>
  <i style="--s:16px;--c:#B57CFF;left:88%;--d:10s;--w:-5s"></i>
  <i style="--s:24px;--c:#48D6A8;left:46%;--d:19s;--w:-12s"></i>
</div>
<main>
  <img class="hero" src="/jelly.png" alt="The Jelly Chase hero, a smiling violet jelly" width="480" height="428">
  <h1>Jelly <span>Chase</span></h1>
  <p class="tag">Squish through hundreds of mazes, grab every jelly drop and stay one hop ahead of the chasers.</p>
  <div class="badges">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.3 0 1.7-.8 3.3-.8s1.9.8 3.3.8c1.4 0 2.2-1.2 3-2.5.9-1.4 1.3-2.8 1.3-2.8s-2.5-1-2.5-4.2zM14 5.3c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
      <div><small>Coming soon</small><b>App Store</b></div>
    </div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M3.6 2.2c-.3.3-.4.7-.4 1.3v17c0 .6.1 1 .4 1.3l9.5-9.8-9.5-9.8zm10.6 10.9 2.6 2.7-10.9 6.3c-.4.2-.8.3-1.1.2l9.4-9.2zm3.9-4 3 1.7c.9.5.9 1.9 0 2.4l-3 1.7-2.9-2.9 2.9-2.9zM5.9 1.9l10.9 6.3-2.6 2.7L4.8 1.7c.3-.1.7 0 1.1.2z"/></svg>
      <div><small>Coming soon</small><b>Google Play</b></div>
    </div>
  </div>
</main>
<footer>
  <a href="/privacy/">Privacy Policy</a>
  <a href="mailto:support@jellychase.app">support@jellychase.app</a>
</footer>
</body>
</html>
