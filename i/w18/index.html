<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>You're invited to Jelly Chase</title>
<meta name="description" content="Jelly Chase. Coming soon to iPhone and Android.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jelly Chase">
<meta property="og:title" content="Play Jelly Chase with me! 🎁">
<meta property="og:description" content="Open the game and we both get 30 coins, a life and 3 powers.">
<meta property="og:image" content="https://jellychase.app/og/w18.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jellychase.app/og/w18.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --violet: #4A2170; --plum: #2B0F45; --orange: #FFA436; --pink: #F2629F; --lime: #B8F04A; }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: Nunito, system-ui, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(120% 80% at 50% 0%, #8A4FD0 0%, var(--violet) 55%, var(--plum) 100%);
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
  }
  /* floating jelly drops in the background */
  .drops { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .drops i {
    position: absolute; bottom: -60px; width: var(--s); height: calc(var(--s) * 1.15);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 35% 30%, #fff9 0 12%, transparent 13%), var(--c);
    box-shadow: inset -4px -6px 0 #0002; opacity: .85;
    animation: rise var(--d) linear infinite; animation-delay: var(--w);
  }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); } }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 24px 32px; gap: 28px; position: relative; z-index: 1; }
  .hero { width: min(300px, 70vw); height: auto; filter: drop-shadow(0 18px 24px #0006); animation: squish 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes squish {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-22px) scale(.97, 1.04); }
    60% { transform: translateY(0) scale(1.06, .93); }
    75% { transform: translateY(0) scale(.98, 1.02); }
  }
  h1 {
    font-family: 'Lilita One', Nunito, sans-serif; font-weight: 400; font-size: clamp(56px, 13vw, 104px); line-height: .95; letter-spacing: 1px;
    -webkit-text-stroke: 10px var(--plum); paint-order: stroke fill; text-shadow: 0 8px 0 var(--plum);
  }
  h1 span { color: var(--orange); }
  .tag { font-size: clamp(18px, 4.6vw, 22px); font-weight: 800; max-width: 520px; line-height: 1.45; opacity: .95; }
  .badges { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .badge {
    display: flex; align-items: center; gap: 12px; padding: 14px 26px 14px 18px; border-radius: 999px;
    background: linear-gradient(#FFC266, var(--orange) 55%, #F27C12); color: #fff;
    border: 3px solid #fff8; box-shadow: 0 6px 0 #B8520A, 0 14px 22px #0005, inset 0 3px 0 #fff8;
    font-family: 'Lilita One', sans-serif; font-size: 20px; letter-spacing: .5px; position: relative;
    text-shadow: 0 2px 0 #B8520A;
  }
  .badge::after { content: ''; position: absolute; left: 18px; top: 6px; width: 30%; height: 8px; border-radius: 8px; background: #fff7; }
  .badge svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 2px 0 #B8520A); }
  .badge small { display: block; font-family: Nunito, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: .9; text-shadow: none; }
  .badge b { display: block; font-weight: 400; line-height: 1; }
  .badge > div { text-align: left; }
  footer { position: relative; z-index: 1; padding: 28px 24px 40px; display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; font-weight: 800; }
  footer a {
    color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 999px;
    background: #ffffff1f; border: 2px solid #ffffff33;
  }
  footer a:hover { background: #ffffff33; }
  @media (prefers-reduced-motion: reduce) { .hero, .drops i { animation: none; } }

  .hero { width: min(220px, 55vw); }
  h1 { font-size: clamp(40px, 10vw, 72px); -webkit-text-stroke: 8px var(--plum); }
  .card { background: #ffffff1a; border: 2px solid #ffffff33; border-radius: 28px; padding: 20px 22px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .card h2 { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; text-shadow: 0 3px 0 var(--plum); }
  .gifts { display: flex; gap: 12px; justify-content: center; }
  .gift { background: #fff; color: var(--plum); border-radius: 18px; padding: 10px 16px; font-family: 'Lilita One', sans-serif; font-size: 22px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 #0003; }
  .gift i { width: 26px; height: 26px; border-radius: 50%; display: inline-block; }
  .coin { background: radial-gradient(circle at 35% 30%, #FFF3B0 0 18%, #FFC93C 20% 70%, #E59A10 72%); }
  .pow { background: radial-gradient(circle at 35% 30%, #fff 0 15%, #B57CFF 17% 70%, #7A3FD0 72%); }
  .steps { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 26px; }
  .steps b { font-size: 16px; opacity: .7; }
  .lv { background: var(--lime); color: var(--plum); font-family: 'Lilita One', sans-serif; font-size: 16px; border-radius: 10px; padding: 3px 8px; }
  .open { text-decoration: none; padding: 14px 34px; }
  .code { font-family: 'Lilita One', sans-serif; font-size: 30px; letter-spacing: 6px; background: #0003; border-radius: 14px; padding: 6px 16px; cursor: pointer; border: 2px dashed #fff6; color: #fff; }
  .soon { font-size: 14px; opacity: .85; }
  .pic { width: min(420px, 92vw); height: auto; border-radius: 26px; border: 4px solid #fff; box-shadow: 0 10px 0 #2B0F45, 0 22px 30px #0006; }
  .gift i.heart { background: #FF4D6D; border-radius: 0; clip-path: path('M13 24 C4 17 0 12 1 7 C2 2 9 0 13 6 C17 0 24 2 25 7 C26 12 22 17 13 24 Z'); }
  .then { font-size: 13px; font-weight: 800; opacity: .85; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="drops" aria-hidden="true" aria-hidden="true">
  <i style="--s:26px;--c:#F2629F;left:6%;--d:14s;--w:-2s"></i>
  <i style="--s:18px;--c:#FFC93C;left:18%;--d:11s;--w:-7s"></i>
  <i style="--s:34px;--c:#48D6A8;left:30%;--d:17s;--w:-4s"></i>
  <i style="--s:20px;--c:#5BA8FF;left:62%;--d:12s;--w:-9s"></i>
  <i style="--s:30px;--c:#FF8A2B;left:76%;--d:15s;--w:-1s"></i>
  <i style="--s:16px;--c:#B57CFF;left:88%;--d:10s;--w:-5s"></i>
  <i style="--s:24px;--c:#48D6A8;left:46%;--d:19s;--w:-12s"></i>
</div>
<main>
  <img class="pic" src="/og/w18.jpg" alt="A jelly in Pony Ranch" width="1200" height="630">
  <h1>Jelly <span>Chase</span></h1>
  <div class="card">
    <h2 id="who">You're invited!</h2>
    <div class="gifts" aria-label="You both get 1 life, 30 coins and 3 powers as soon as you open the game"><span class="gift"><i class="heart"></i>+1</span><span class="gift"><i class="coin"></i>+30</span><span class="gift"><i class="pow"></i>+3</span></div>
    <a class="badge open" id="open" href="petchase://invite"><div><b>Open in the game</b></div></a>
    <button class="code" id="code" type="button" hidden aria-label="Copy invite code"></button>
    <p class="soon">No game yet? Coming soon to iPhone and Android.</p>
  </div>
</main>
<footer><a href="/privacy/">Privacy Policy</a></footer>
<script src="/store.js"></script>
<script>
(function () {
  // "Open in the game": if the game isn't installed the page stays visible,
  // so after a moment send iPhone to the App Store and Android to Google Play.
  var open = document.getElementById('open'), store = window.jcStoreUrl ? jcStoreUrl() : '';
  if (store) {
    var soon = document.querySelector('.soon');
    soon.innerHTML = 'No game yet? <a href="' + store + '" style="color:#FFC93C">Get it free</a>';
  }
  open.addEventListener('click', function () {
    if (!store) return;
    var t = setTimeout(function () { if (!document.hidden) location.href = store; }, 1600);
    document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); }, { once: true });
  });
})();
(function () {
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/[<>&"]/g, '').slice(0, 14);
  if (n) document.getElementById('who').textContent = n + ' invited you!';
  if (!c) return;
  document.getElementById('open').href = 'petchase://invite?c=' + c;
  // one tap from the chat: try to open the game straight away (if it is not installed the page just stays)
  try { if (!sessionStorage.getItem('jcTried')) { sessionStorage.setItem('jcTried', '1'); setTimeout(function () { location.href = 'petchase://invite?c=' + c; }, 350); } } catch (e) {}
  var b = document.getElementById('code'); b.textContent = c; b.hidden = false;
  b.onclick = function () { try { navigator.clipboard.writeText(c); b.textContent = '✓ ' + c; } catch (e) {} };
})();
</script>
</body>
</html>
